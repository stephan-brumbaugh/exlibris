# Ex Libris on TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML, paste this file.
# The image is built automatically by GitHub from https://github.com/stephan-brumbaugh/exlibris
# To update later: Apps → exlibris → Update (or "Pull image" then restart).
#
# Before the first start, create this dataset/folder (back it up — it holds the database, covers, uploads, decorations):
#   /mnt/HomeLab/exlibris/data
# and point the /library mount below at the folder that already holds your e-books and PDFs.
services:
  exlibris:
    image: ghcr.io/stephan-brumbaugh/exlibris:latest
    pull_policy: always
    container_name: exlibris
    restart: unless-stopped
    # 568 is the TrueNAS "apps" user. It needs write access to the data folder
    # and read access to the library folder.
    user: "568:568"
    ports:
      - "13100:3000"
    environment:
      ADMIN_PASSWORD: "change-me-please"   # first sign-in password; change it in Settings and you can delete this line
      LIBRARY_DIRS: /library               # several folders: "/library,/comics"
      SCAN_INTERVAL_MINUTES: "60"          # 0 = only scan at startup and when you press "Scan now"
      TZ: America/Chicago
    volumes:
      - /mnt/HomeLab/exlibris/data:/data
      - /mnt/HomeLab/Media/Books:/library:ro
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
